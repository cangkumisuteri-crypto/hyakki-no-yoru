  set('hy_run', '1');
  /* a session that stayed alive for 90 s and then exited cleanly proves the renderer is fine: forget old crashes (a persistent hy_safe from script errors is kept) */

  document.addEventListener('visibilitychange', function () { if (document.hidden) clean(); else set('hy_run', '1'); });

  var lite = forced >= 0 ? forced >= 1 : (ios || phone || crash > 0);
